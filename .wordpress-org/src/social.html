<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doppelslug social preview</title>
<style>
	html, body { margin: 0; padding: 0; }
	.banner {
		position: relative;
		width: 1280px;
		height: 640px;
		overflow: hidden;
		background: radial-gradient(circle at 75% 45%, #1f4e86 0, #12263f 55%, #0c1a2c 100%);
		font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
		color: #fff;
	}
	.copy { position: absolute; left: 80px; top: 196px; width: 520px; }
	.name { font-size: 96px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
	.tagline { margin-top: 26px; font-size: 32px; line-height: 1.3; color: #c8d8ea; }
	.repo { position: absolute; left: 80px; bottom: 56px; font-size: 24px; color: #8fa9c6; }
	.bar {
		position: absolute; left: 700px; top: 170px; width: 520px; height: 76px;
		border-radius: 38px; background: #fff; color: #1e1e1e;
		display: flex; align-items: center; padding: 0 32px; box-sizing: border-box;
		font-size: 30px; box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
	}
	.bar .host { color: #8a94a6; }
	.bar .caret { display: inline-block; width: 3px; height: 36px; margin-left: 4px; background: #2271b1; }
	.card {
		position: absolute; top: 440px; width: 270px; height: 66px; border-radius: 14px;
		display: flex; align-items: center; justify-content: center;
		font-size: 26px; font-family: Consolas, "SFMono-Regular", Menlo, monospace;
		box-shadow: 0 12px 30px rgba(0, 0, 0, .3);
	}
	.card b { font-weight: 700; }
	.left { left: 685px; background: #ffffff; color: #1e1e1e; }
	.right { left: 985px; background: #f0b849; color: #1e1e1e; }
	.badge {
		position: absolute; left: 924px; top: 300px; width: 72px; height: 72px; border-radius: 50%;
		background: #f0b849; color: #1e1e1e; font-size: 46px; font-weight: 700;
		display: flex; align-items: center; justify-content: center;
		box-shadow: 0 0 0 10px rgba(240, 184, 73, .18);
	}
	svg.fork { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="banner">
	<svg class="fork" width="1280" height="640" viewBox="0 0 1280 640" fill="none" stroke-linecap="round" stroke-width="10">
		<path d="M960 246 V300" stroke="#ffffff" stroke-opacity=".85"/>
		<path d="M960 372 C960 405 820 405 820 440" stroke="#ffffff" stroke-opacity=".85"/>
		<path d="M960 372 C960 405 1120 405 1120 440" stroke="#f0b849"/>
	</svg>
	<div class="copy">
		<div class="name">Doppelslug</div>
		<div class="tagline">Catch lookalike URLs before your visitors land on the wrong post.</div>
	</div>
	<div class="repo">WordPress plugin · github.com/ararai1991/doppelslug</div>
	<div class="bar"><span class="host">example.com/</span>how-write-b<span class="caret"></span></div>
	<div class="badge">?</div>
	<div class="card left">how-write-b<b>ook</b></div>
	<div class="card right">how-write-b<b>log</b></div>
</div>
</body>
</html>
