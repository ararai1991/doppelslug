<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doppelslug icon</title>
<style>
	html, body { margin: 0; padding: 0; background: transparent; }
	svg { display: block; width: 256px; height: 256px; }
</style>
</head>
<body>
<!-- One address forks into two destinations: the lookalike slug problem. -->
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1f4e86"/>
			<stop offset="1" stop-color="#2271b1"/>
		</linearGradient>
	</defs>
	<rect width="256" height="256" fill="url(#bg)"/>
	<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
		<path d="M128 140 C128 108 164 100 182 72" stroke="#f0b849"/>
		<path d="M128 140 C128 108 92 100 74 72" stroke="#ffffff"/>
		<path d="M128 214 V140" stroke="#ffffff"/>
	</g>
	<circle cx="70" cy="62" r="24" fill="#ffffff"/>
	<circle cx="186" cy="62" r="24" fill="#f0b849"/>
	<circle cx="128" cy="214" r="13" fill="#ffffff"/>
</svg>
</body>
</html>
