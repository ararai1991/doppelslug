name: Release

# Pushing a tag such as v1.0.0 builds the plugin ZIP and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the ZIP
        run: python bin/build-zip.py
      - name: Check the tag matches the plugin version
        run: |
          test -f "dist/doppelslug-${GITHUB_REF_NAME#v}.zip" || {
            echo "Tag ${GITHUB_REF_NAME} does not match the version in doppelslug/doppelslug.php"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
